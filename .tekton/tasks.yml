---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean the source workspace before a new pipeline run.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3.20
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        if [ -d "${WORKSPACE_SOURCE_PATH}" ]; then
          find "${WORKSPACE_SOURCE_PATH}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        fi
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8
spec:
  description: Install dependencies and lint application and tests with flake8.
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        flake8 service tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 service tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Run the service unit tests with nose.
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to nose
      type: string
      default: "-v --with-spec --spec-color --with-coverage --cover-package=service"
  steps:
    - name: unit-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
        nosetests $(params.args)
